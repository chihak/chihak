<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
body{margin:0;font-family:"Liberation Sans","Noto Sans CJK JP",sans-serif;}
.logo{width:800px;height:800px;background:#e63946;position:relative;overflow:hidden}
.logo .card{position:absolute;left:90px;top:90px;width:620px;height:620px;border-radius:50%;background:#fbfaf5}
.banner{width:2560px;height:1440px;background:#fbfaf5;position:relative;overflow:hidden}
.word{font-weight:800;letter-spacing:-2px}
.word span{color:#e63946}
</style></head><body>
<div id="logo" class="logo">
  <div class="card"></div>
  <svg width="800" height="800" viewBox="0 0 800 800" style="position:absolute;left:0;top:0">
    <defs><filter id="r"><feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/><feDisplacementMap in="SourceGraphic" scale="6"/></filter></defs>
    <g filter="url(#r)" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <!-- stethoscope drawn like a marker sketch -->
      <path d="M 285 230 C 250 230 240 260 245 300 C 255 380 300 430 360 440 C 420 430 465 380 475 300 C 480 260 470 230 435 230" stroke="#1d1d1d" stroke-width="22"/>
      <path d="M 360 440 L 360 500 C 360 590 430 620 490 600 C 550 580 560 520 560 470" stroke="#1d1d1d" stroke-width="22"/>
      <circle cx="560" cy="430" r="48" stroke="#1d1d1d" stroke-width="22"/>
      <circle cx="560" cy="430" r="14" fill="#e63946" stroke="none"/>
      <!-- pencil -->
      <g transform="rotate(35 300 560)">
        <rect x="240" y="520" width="150" height="40" rx="6" fill="#ffd166" stroke="#1d1d1d" stroke-width="10"/>
        <path d="M 390 520 L 440 540 L 390 560 Z" fill="#fbfaf5" stroke="#1d1d1d" stroke-width="10"/>
        <path d="M 425 534 L 440 540 L 425 546 Z" fill="#1d1d1d" stroke="#1d1d1d" stroke-width="6"/>
        <rect x="215" y="520" width="25" height="40" rx="6" fill="#e63946" stroke="#1d1d1d" stroke-width="10"/>
      </g>
    </g>
  </svg>
</div>
<div id="banner" class="banner">
  <svg width="2560" height="1440" viewBox="0 0 2560 1440" style="position:absolute;left:0;top:0">
    <defs><filter id="r2"><feTurbulence type="fractalNoise" baseFrequency="0.015" numOctaves="2" seed="5"/><feDisplacementMap in="SourceGraphic" scale="7"/></filter></defs>
    <g filter="url(#r2)" fill="none" stroke="#1d1d1d" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" opacity="0.9">
      <path transform="translate(-210 -60)" d="M 640 760 C 520 680 540 560 640 610 C 740 560 760 680 640 760 Z" stroke="#e63946" stroke-width="11"/>
      <path d="M 250 850 L 330 850 L 355 800 L 390 910 L 425 760 L 460 890 L 485 850 L 610 850" stroke="#e63946" stroke-width="10"/>
      <path transform="translate(2140 640) scale(0.36) translate(-545 -830)" d="M 330 900 C 280 860 290 780 350 760 C 340 700 400 650 460 670 C 490 620 580 620 610 665 C 670 640 740 680 735 740 C 800 760 810 840 760 880 C 780 940 720 990 660 970 C 630 1010 560 1010 530 975 C 490 1010 410 1000 400 950 C 350 960 310 930 330 900 Z" stroke-width="26"/>
      <path d="M 2060 860 Q 2140 800 2220 860 Q 2140 920 2060 860 Z"/><circle cx="2140" cy="860" r="24"/>
    </g>
  </svg>
  <div class="word" style="position:absolute;left:0;right:0;top:545px;text-align:center;font-size:150px;color:#1d1d1d">Sketch<span>Clinic</span></div>
  <div style="position:absolute;left:0;right:0;top:735px;text-align:center;font-size:52px;font-weight:700;color:#444">Your body, explained in 60 seconds</div>
  <div style="position:absolute;left:0;right:0;top:815px;text-align:center;font-size:36px;color:#888">English · Español · Français · 日本語</div>
</div>
</body></html>
